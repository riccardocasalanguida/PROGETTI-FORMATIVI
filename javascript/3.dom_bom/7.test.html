        //Traccia: Crea un bottone che chiama una funzione quando viene cliccato.
        function cliccato() {
        alert("Hello World!");
        }
        let fun = document.getElementById("click").addEventListener("click", cliccato);
        
        //Traccia: Cambia il testo del bottone quando viene cliccato.
        function changeText(btn) {
            btn.innerText="STO CAMBIANDO IL TESTO";
        }

        //Traccia: Crea un div che diventa rosso al doppio click.
        function mouseOver() {
        document.getElementById("onMouse").style.color = "red";
        }
        function mouseOut() {
        document.getElementById("onMouse").style.color = "green";
        }

        function myDiv(element) {
            element.style.background = "red";
        }

        //Traccia: Crea un bottone che, quando cliccato, diventa disabilitato.
        function myButton(mb) {
            mb.disable = true;
            mb.innerText = "DISABILTATO";
        }

        //Evento temporizzato
        setTimeout(timeout, 5000);
        function timeout() {
        document.getElementById("crono").innerHTML = "TEMPO SCADUTO";
        document.getElementById("crono").style.color = "red";
        document.getElementById("crono").style.fontSize = "50px"
        document.getElementById("crono").style.textAlign = "center";
        }
        //set intervallo 
        setInterval(interval, 1000);
        function interval() {
        let d = new Date();
        document.getElementById("intervallo").innerHTML = d.getHours() + ":" + d.getMinutes() + ":" + d.getSeconds();
        document.getElementById("intervallo").style.color = "red";
        document.getElementById("intervallo").style.fontSize = "60px";
        }
